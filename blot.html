<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بلوت</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Tajawal', sans-serif;
  background: #EDEADE;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px 40px;
  gap: 12px;
}

.scores {
position: relative;
display: grid; grid-template-columns: 1fr 1fr;
width: 100%; max-width: 420px;
background: #fff; border-radius: 24px;
box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: visible;
}
.team { padding: 24px 12px; text-align: center; }
.team:first-child { border-left: 1px solid #f0f0f0; }
.team-name { font-size: 0.95rem; font-weight: 800; margin-bottom: 8px; }
.us .team-name   { color: #1a7f64; }
.them .team-name { color: #c0392b; }
.team-total { font-size: 4rem; font-weight: 900; line-height: 1; letter-spacing: -2px; }
.team-total.pop { animation: pop 0.25s ease; }
@keyframes pop { 50%{ transform: scale(1.12); } }
.us .team-total   { color: #1a7f64; }
.them .team-total { color: #c0392b; }
.target-line { font-size: 0.72rem; color: #bbb; margin-top: 6px; font-weight: 600; }

/* Dealer Arrow */
.dealer-arrow-wrap {
position: absolute;
left: 50%; top: 50%;
transform: translate(-50%, -50%);
z-index: 20;
display: flex; flex-direction: column; align-items: center; gap: 4px;
pointer-events: none;
}
.dealer-circle {
width: 48px; height: 48px; border-radius: 50%;
background: #fff;
border: 2px solid #e0e0e0;
box-shadow: 0 2px 12px rgba(0,0,0,0.12);
display: flex; align-items: center; justify-content: center;
}
.dealer-circle svg {
transition: transform 0.5s cubic-bezier(.34,1.4,.64,1);
}
.dealer-arrow-label {
font-size: 0.6rem; font-weight: 900; color: #aaa;
background: #fff; border-radius: 6px; padding: 2px 6px;
border: 1px solid #eee; white-space: nowrap;
box-shadow: 0 1px 4px rgba(0,0,0,0.07);
}

.winner-msg {
display: none; width: 100%; max-width: 420px;
padding: 12px; border-radius: 14px; font-weight: 800; font-size: 1rem; text-align: center;
}
.winner-msg.show { display: block; }
.winner-msg.us   { background: #d4f0e8; color: #1a7f64; }
.winner-msg.them { background: #fde8e8; color: #c0392b; }
.winner-msg.draw { background: #fff8e6; color: #b07d00; }

.card {
width: 100%; max-width: 420px; background: #fff;
border-radius: 24px; padding: 20px;
box-shadow: 0 4px 20px rgba(0,0,0,0.07);
}
.card-title { font-size: 0.9rem; font-weight: 800; color: #bbb; margin-bottom: 16px; }

.target-row {
display: flex; align-items: center; justify-content: space-between;
width: 100%; max-width: 420px; background: #fff;
border-radius: 16px; padding: 14px 18px;
box-shadow: 0 4px 20px rgba(0,0,0,0.07);
}
.target-label { font-size: 0.9rem; font-weight: 800; color: #444; }
.target-select {
border: none; background: #EDEADE; padding: 7px 12px;
border-radius: 10px; font-family: ‘Tajawal’, sans-serif;
font-size: 0.9rem; font-weight: 800; color: #444; cursor: pointer; outline: none;
}

.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.inp-wrap label { display: block; font-size: 0.9rem; font-weight: 800; margin-bottom: 7px; }
.inp-wrap.us label   { color: #1a7f64; }
.inp-wrap.them label { color: #c0392b; }
input[type=number] {
width: 100%; padding: 14px; font-size: 1.7rem; font-weight: 900;
font-family: ‘Tajawal’, sans-serif; text-align: center;
border: 2px solid #eee; border-radius: 14px; outline: none; color: #222;
-moz-appearance: textfield; transition: border-color 0.15s; background: #fafafa;
}
input[type=number]::-webkit-inner-spin-button { display: none; }
input[type=number]:focus { border-color: #bbb; background: #fff; }

.quick-btns { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.qrow {
display: grid; grid-template-columns: 1fr auto 1fr;
border-radius: 14px; overflow: hidden; border: 2px solid #eee; background: #fafafa;
}
.qrow-label {
font-size: 1rem; font-weight: 900; color: #888;
display: flex; align-items: center; justify-content: center;
padding: 13px 8px; border-right: 1px solid #eee; border-left: 1px solid #eee; min-width: 44px;
}
.qhalf {
padding: 13px 10px; border: none; background: none;
font-family: ‘Tajawal’, sans-serif; font-size: 0.9rem;
font-weight: 900; cursor: pointer; transition: background 0.12s; text-align: center;
}
.qhalf.us   { color: #1a7f64; }
.qhalf.them { color: #c0392b; }
.qhalf.us:active   { background: #eaf7f2; }
.qhalf.them:active { background: #fdecea; }

.add-btn {
width: 100%; padding: 15px; background: #222; color: #fff; border: none;
border-radius: 14px; font-family: ‘Tajawal’, sans-serif; font-size: 1.05rem;
font-weight: 900; cursor: pointer; transition: background 0.15s, transform 0.1s;
}
.add-btn:active { background: #444; transform: scale(0.98); }

.history-card {
width: 100%; max-width: 420px; background: #fff;
border-radius: 24px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.07);
}
.hist-head {
display: flex; justify-content: space-between; align-items: center;
padding: 15px 20px; border-bottom: 1px solid #f0f0f0;
}
.hist-title { font-size: 0.9rem; font-weight: 800; color: #999; }
.clear-btn {
background: none; border: none; font-family: ‘Tajawal’, sans-serif;
font-size: 0.8rem; font-weight: 800; color: #e74c3c; cursor: pointer; opacity: 0.6;
}
.clear-btn:hover { opacity: 1; }
.empty { padding: 30px; text-align: center; font-size: 0.9rem; color: #ccc; font-weight: 600; }
.round-wrap {
position: relative; overflow: hidden;
border-bottom: 1px solid #f7f7f7;
animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; } }
.del-bg {
position: absolute; inset: 0; background: #fee2e2;
display: flex; align-items: center; padding-left: 20px; pointer-events: none;
}
.del-bg-icon { font-size: 1.2rem; color: #e74c3c; font-weight: 900; }
.round-row {
display: flex; align-items: center; padding: 14px 16px;
gap: 10px; background: #fff; transition: transform 0.2s ease;
position: relative; touch-action: pan-y; cursor: pointer;
}
.rnd-num  { font-size: 0.85rem; color: #ccc; font-weight: 800; min-width: 24px; }
.rnd-us   { font-size: 1.15rem; font-weight: 900; color: #1a7f64; min-width: 38px; text-align: center; }
.rnd-them { font-size: 1.15rem; font-weight: 900; color: #c0392b; min-width: 38px; text-align: center; }
.rnd-sep  { color: #ddd; font-size: 1rem; }
.rnd-dealer { flex: 1; font-size: 0.85rem; color: #bbb; font-weight: 700; text-align: center; }
.del-btn {
background: #fee2e2; border: none; border-radius: 10px; color: #e74c3c;
cursor: pointer; font-size: 1rem; padding: 6px 10px; font-weight: 900; flex-shrink: 0;
transition: background 0.15s;
}
.del-btn:active { background: #fca5a5; }

.tawleed-entry {
position: static; width: 100%; max-width: 420px;
padding: 18px; background: #2d6a4f; color: #fff; border: none; border-radius: 20px;
font-family: ‘Tajawal’, sans-serif; font-size: 1.05rem; font-weight: 900;
cursor: pointer; box-shadow: 0 8px 24px rgba(45,106,79,0.35);
transition: transform 0.15s; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.tawleed-entry:active { transform: scale(0.97); }

.overlay {
display: none; position: fixed; inset: 0; z-index: 200;
background: #111; flex-direction: column; align-items: center;
padding: 24px 16px 40px; overflow-y: auto;
}
.overlay.show { display: flex; animation: slideUp 0.3s ease; }
@keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
.overlay-head {
width: 100%; max-width: 420px;
display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
}
.overlay-title { font-size: 1.3rem; font-weight: 900; color: #fff; }
.close-ov-btn {
background: #c0392b; border: none; border-radius: 12px; padding: 8px 18px;
font-family: ‘Tajawal’, sans-serif; font-size: 0.9rem; font-weight: 900; color: #fff;
cursor: pointer; box-shadow: 0 3px 10px rgba(192,57,43,0.4); transition: background 0.15s;
}
.close-ov-btn:active { background: #a93226; }

.table-wrap { position: relative; width: 320px; height: 320px; margin: 0 auto 28px; }
.table-wrap::before {
content: ‘’; position: absolute; inset: -6px; border-radius: 50%;
background: conic-gradient(#b8972a, #f7e07a, #c9a84c, #ffe599, #b8972a);
opacity: 0.6; z-index: 0;
}
.table-wrap::after {
content: ‘’; position: absolute; inset: -2px; border-radius: 50%; background: #111; z-index: 1;
}
.felt-circle {
position: absolute; inset: 50px; z-index: 3;
background: radial-gradient(circle at 35% 35%, #1f5c3e, #0a1f15);
border-radius: 50%; border: 3px solid #1a3d2a;
box-shadow: 0 0 60px rgba(0,0,0,0.8), inset 0 4px 16px rgba(0,0,0,0.5), inset 0 0 30px rgba(10,80,40,0.3);
display: flex; align-items: center; justify-content: center;
}
.felt-circle::before {
content: ‘’; position: absolute; inset: 10px; border-radius: 50%;
border: 1px solid rgba(247,201,72,0.15);
}
.felt-text {
font-size: 1.05rem; font-weight: 900; color: rgba(247,201,72,0.5);
letter-spacing: 4px; text-shadow: 0 0 12px rgba(247,201,72,0.3);
}
.seat {
position: absolute; display: flex; flex-direction: column;
align-items: center; gap: 6px; transition: all 0.3s; z-index: 4;
}
.seat[data-i=“0”] { bottom: 2px; left: 50%; transform: translateX(-50%); }
.seat[data-i=“1”] { top: 50%;  right: 2px; transform: translateY(-50%); }
.seat[data-i=“2”] { top: 2px;  left: 50%; transform: translateX(-50%); }
.seat[data-i=“3”] { top: 50%;  left: 2px; transform: translateY(-50%); }
.seat-light {
width: 18px; height: 18px; border-radius: 50%; background: #333;
box-shadow: none; transition: background 0.12s, box-shadow 0.12s; flex-shrink: 0;
}
.seat[data-i=“0”] .seat-light { order: 1; }
.seat-name {
font-size: 0.95rem; font-weight: 900; color: #ccc; background: #181818;
border: 1.5px solid rgba(247,201,72,0.2); border-radius: 12px; padding: 7px 14px;
max-width: 88px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
transition: all 0.35s; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.seat[data-i=“0”].lit .seat-light,
.seat[data-i=“1”].lit .seat-light,
.seat[data-i=“2”].lit .seat-light,
.seat[data-i=“3”].lit .seat-light { background: #f7c948; box-shadow: 0 0 14px 6px rgba(247,201,72,0.7); }
.seat.winner .seat-light {
background: #f7c948;
box-shadow: 0 0 20px 10px rgba(247,201,72,0.9), 0 0 40px 16px rgba(247,201,72,0.4) !important;
animation: winPulse 0.7s ease infinite alternate;
}
@keyframes winPulse {
from { box-shadow: 0 0 16px 8px rgba(247,201,72,0.8), 0 0 32px 14px rgba(247,201,72,0.3); }
to   { box-shadow: 0 0 28px 14px rgba(247,201,72,1), 0 0 56px 22px rgba(247,201,72,0.5); }
}
.seat.winner .seat-name {
background: #2a2000; border-color: #f7c948;
color: #f7c948; box-shadow: 0 0 12px rgba(247,201,72,0.4); transform: scale(1.1);
}
.result-banner {
display: none; width: 100%; max-width: 420px;
padding: 16px; background: #1a1400; border: 2px solid #f7c948;
border-radius: 16px; text-align: center; font-size: 1.2rem; font-weight: 900; color: #f7c948;
margin-bottom: 12px;
}
.result-banner.show { display: block; animation: popIn 0.4s ease; }
@keyframes popIn { 0%{transform:scale(0.88);opacity:0} 60%{transform:scale(1.04)} 100%{transform:scale(1);opacity:1} }
.dealer-bar {
display: none; width: 100%; max-width: 420px;
background: #1e1e1e; border-radius: 16px; padding: 14px 18px; border: 1px solid #333;
flex-direction: row; align-items: center; justify-content: space-between; margin-bottom: 12px;
}
.dealer-lbl { font-size: 0.85rem; font-weight: 800; color: #777; margin-bottom: 3px; }
.dealer-name { font-size: 1.15rem; font-weight: 900; color: #fff; }
.next-lbl { font-size: 0.85rem; color: #777; font-weight: 700; }
.spin-btn {
width: 100%; max-width: 420px; padding: 16px;
background: #f7c948; color: #111; border: none; border-radius: 16px;
font-family: ‘Tajawal’, sans-serif; font-size: 1.1rem; font-weight: 900;
cursor: pointer; transition: all 0.15s; margin-bottom: 10px;
box-shadow: 0 4px 20px rgba(247,201,72,0.3);
}
.spin-btn:active { transform: scale(0.98); }
.spin-btn:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }
.reset-btn {
width: 100%; max-width: 420px; padding: 12px;
background: none; border: 1px solid #333; border-radius: 14px;
font-family: ‘Tajawal’, sans-serif; font-size: 0.85rem; font-weight: 700;
color: #555; cursor: pointer; transition: all 0.15s;
}
.reset-btn:hover { border-color: #555; color: #888; }

/* New Game Button */
.new-game-btn {
width: 100%; padding: 13px; margin-top: 10px;
background: #fff; color: #444; border: 2px solid #e0e0e0;
border-radius: 14px; font-family: ‘Tajawal’, sans-serif; font-size: 1rem;
font-weight: 900; cursor: pointer; transition: all 0.2s;
}
.new-game-btn.confirm {
background: #e74c3c; color: #fff; border-color: #e74c3c;
box-shadow: 0 4px 16px rgba(231,76,60,0.35);
animation: shakeBtn 0.3s ease;
}
@keyframes shakeBtn {
0%{transform:scale(1)} 30%{transform:scale(1.03)} 60%{transform:scale(0.97)} 100%{transform:scale(1)}
}
.new-game-btn:active { transform: scale(0.98); }

/* Clear All Button - more visible */
.clear-btn-big {
background: #fee2e2; border: 1.5px solid #f5a9a9; border-radius: 10px;
font-family: ‘Tajawal’, sans-serif; font-size: 0.85rem; font-weight: 900;
color: #c0392b; cursor: pointer; padding: 7px 14px;
transition: all 0.15s; box-shadow: 0 1px 4px rgba(192,57,43,0.1);
}
.clear-btn-big:hover { background: #fca5a5; }
.clear-btn-big:active { transform: scale(0.96); }
</style>

</head>
<body>

<div class="scores">
  <div class="team us">
    <div class="team-name">نحن</div>
    <div class="team-total" id="usTotal">0</div>
    <div class="target-line" id="usProgress"></div>
  </div>
  <div class="team them">
    <div class="team-name">هم</div>
    <div class="team-total" id="themTotal">0</div>
    <div class="target-line" id="themProgress"></div>
  </div>
  <!-- Dealer Arrow between scores -->
  <div class="dealer-arrow-wrap" id="dealerArrowWrap" style="display:none">
    <div class="dealer-circle">
      <svg id="dealerArrowSvg" width="34" height="34" viewBox="0 0 34 34">
        <polygon points="17,3 23,19 17,15 11,19" fill="#1a7f64"/>
        <circle cx="17" cy="24" r="3.5" fill="#1a7f64" opacity="0.4"/>
      </svg>
    </div>
    <div class="dealer-arrow-label" id="dealerArrowLabel">الموزع</div>
  </div>
</div>

<div class="winner-msg" id="winnerMsg"></div>

<div class="target-row">
  <span class="target-label">&#127919; هدف الفوز</span>
  <select class="target-select" id="targetScore" onchange="render()">
    <option value="152">152 نقطة</option>
    <option value="200">200 نقطة</option>
    <option value="250">250 نقطة</option>
    <option value="300">300 نقطة</option>
    <option value="0">بدون حد</option>
  </select>
</div>

<div class="card">
  <div class="card-title">إضافة جولة</div>
  <div class="inputs">
    <div class="inp-wrap us">
      <label>نقاط نحن</label>
      <input type="number" id="usInp" placeholder="0" min="0">
    </div>
    <div class="inp-wrap them">
      <label>نقاط هم</label>
      <input type="number" id="themInp" placeholder="0" min="0">
    </div>
  </div>
  <div class="quick-btns">
    <div class="qrow">
      <button class="qhalf us" onclick="addQuick(26,'us')">نحن +26</button>
      <span class="qrow-label">26</span>
      <button class="qhalf them" onclick="addQuick(26,'them')">هم +26</button>
    </div>
    <div class="qrow">
      <button class="qhalf us" onclick="addQuick(16,'us')">نحن +16</button>
      <span class="qrow-label">16</span>
      <button class="qhalf them" onclick="addQuick(16,'them')">هم +16</button>
    </div>
  </div>
  <button class="add-btn" onclick="addRound()">إضافة الجولة</button>
  <button class="new-game-btn" id="newGameBtn" onclick="newGameToggle()">🔄 صكة جديدة</button>
</div>

<div class="history-card">
  <div class="hist-head">
    <span class="hist-title">الجولات</span>
    <button class="clear-btn-big" onclick="clearAll()">حذف الكل</button>
  </div>
  <div id="histList"><div class="empty">لا توجد جولات بعد</div></div>
</div>

<button class="tawleed-entry" onclick="openTawleed()">🁔 التويليد</button>

<div class="overlay" id="tawleedOverlay">
  <div class="overlay-head">
    <span class="overlay-title">&#127060; التويليد</span>
    <button class="close-ov-btn" onclick="closeTawleed()">&#10005; رجوع</button>
  </div>
  <div class="table-wrap">
    <div class="seat" data-i="0" id="seat0">
      <span class="seat-name" id="sn0">أنا</span>
      <div class="seat-light"></div>
    </div>
    <div class="seat" data-i="1" id="seat1">
      <div class="seat-light"></div>
      <span class="seat-name" id="sn1">خصم ١</span>
    </div>
    <div class="seat" data-i="2" id="seat2">
      <div class="seat-light"></div>
      <span class="seat-name" id="sn2">شريكي</span>
    </div>
    <div class="seat" data-i="3" id="seat3">
      <div class="seat-light"></div>
      <span class="seat-name" id="sn3">خصم ٢</span>
    </div>
    <div class="felt-circle"><span class="felt-text">بلوت</span></div>
  </div>
  <div class="result-banner" id="resultBanner"></div>
  <div class="dealer-bar" id="dealerBar">
    <div>
      <div class="dealer-lbl">الموزع الحالي</div>
      <div class="dealer-name" id="dealerBarName"></div>
    </div>
    <div class="next-lbl" id="dealerBarNext"></div>
  </div>
  <button class="spin-btn" id="spinBtn" onclick="spinTawleed()">&#127922; تويليد</button>
  <button class="reset-btn" onclick="resetTawleed()">&#8617; إعادة الإعداد</button>
</div>

<script>
let rounds = [], players = [], dealerIdx = -1;
let spinning = false, lightInterval = null;
let arrowDeg = 0;

const AC = new (window.AudioContext || window.webkitAudioContext)();

function playClick(t) {
  const sr = AC.sampleRate, dur = 0.055;
  const buf = AC.createBuffer(1, sr*dur, sr);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.8);
  const src=AC.createBufferSource(), hi=AC.createBiquadFilter(), g=AC.createGain();
  hi.type='highpass'; hi.frequency.value=1800;
  g.gain.setValueAtTime(0.18+(1-(t||0))*0.12, AC.currentTime);
  src.buffer=buf; src.connect(hi); hi.connect(g); g.connect(AC.destination); src.start();
}

function playWin() {
  [{f:330,t:0,d:0.4},{f:415,t:150,d:0.4},{f:554,t:300,d:0.6}].forEach(({f,t,d})=>{
    setTimeout(()=>{
      const o=AC.createOscillator(),g=AC.createGain(),filt=AC.createBiquadFilter();
      filt.type='lowpass'; filt.frequency.value=1200;
      o.connect(filt); filt.connect(g); g.connect(AC.destination);
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0,AC.currentTime);
      g.gain.linearRampToValueAtTime(0.15,AC.currentTime+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
      o.start(); o.stop(AC.currentTime+d+0.05);
    },t);
  });
}

function playAddRound() {
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g); g.connect(AC.destination); o.type='sine';
  o.frequency.setValueAtTime(900,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(600,AC.currentTime+0.06);
  g.gain.setValueAtTime(0.09,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.08);
  o.start(); o.stop(AC.currentTime+0.08);
}

const FIXED_NAMES = ['أنا','خصم ١','شريكي','خصم ٢'];
// seat positions: 0=bottom, 1=right, 2=top, 3=left
// arrow pointing toward each seat from center:
// seat0(bottom) = point down  = 180deg
// seat1(right)  = point right = 90deg  (RTL layout: right side = خصم١)
// seat2(top)    = point up    = 0deg
// seat3(left)   = point left  = 270deg
const SEAT_ARROW_DEG = [180, 90, 0, 270];

function setArrow(idx, name) {
  const wrap = document.getElementById('dealerArrowWrap');
  const svg  = document.getElementById('dealerArrowSvg');
  const lbl  = document.getElementById('dealerArrowLabel');
  if (idx < 0) { wrap.style.display='none'; return; }
  wrap.style.display = 'flex';
  const target = SEAT_ARROW_DEG[idx];
  // rotate the shortest path
  let diff = ((target - arrowDeg) % 360 + 360) % 360;
  if (diff > 180) diff -= 360;
  arrowDeg += diff;
  svg.style.transform = 'rotate(' + arrowDeg + 'deg)';
  lbl.textContent = name || FIXED_NAMES[idx];
}

function syncNames() {
  [0,1,2,3].forEach(i => document.getElementById('sn'+i).textContent = FIXED_NAMES[i]);
}

function litSeat(i, on) {
  document.getElementById('seat'+i).classList.toggle('lit', on);
}
function clearAllLights() {
  [0,1,2,3].forEach(i => document.getElementById('seat'+i).classList.remove('lit','winner'));
}
function stopLights() {
  clearInterval(lightInterval);
  [0,1,2,3].forEach(i => litSeat(i,false));
}

function spinTawleed() {
  if (spinning) return;
  if (AC.state==='suspended') AC.resume();
  spinning = true;
  syncNames();
  players = FIXED_NAMES.slice();
  document.getElementById('resultBanner').classList.remove('show');
  clearAllLights();
  document.getElementById('spinBtn').disabled = true;

  const winner = Math.floor(Math.random()*4);
  const duration = 2600, start = performance.now();
  let lastLit = -1;

  function step(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed/duration, 1);
    const speed = 80 + Math.pow(t,2)*320;
    const seatToLit = Math.floor(elapsed/speed) % 4;
    if (seatToLit !== lastLit) {
      [0,1,2,3].forEach(i => litSeat(i,false));
      litSeat(seatToLit, true);
      playClick(t);
      lastLit = seatToLit;
    }
    if (t < 1) { requestAnimationFrame(step); return; }
    stopLights();
    dealerIdx = winner;
    document.getElementById('seat'+winner).classList.add('winner');
    const banner = document.getElementById('resultBanner');
    banner.textContent = '👑 الموزع: ' + players[winner];
    banner.classList.add('show');
    playWin();
    updateDealerBar();
    setArrow(winner, players[winner]);
    document.getElementById('spinBtn').disabled = false;
    document.getElementById('spinBtn').textContent = '🔄 تويليد جديد';
    spinning = false;
  }
  requestAnimationFrame(step);
}

function updateDealerBar() {
  if (dealerIdx<0 || !players.length) return;
  const bar = document.getElementById('dealerBar');
  bar.style.display = 'flex';
  document.getElementById('dealerBarName').textContent = players[dealerIdx];
  const next = (dealerIdx+1)%4;
  document.getElementById('dealerBarNext').textContent = 'التالي: ' + players[next];
}

function resetTawleed() {
  dealerIdx = -1;
  clearAllLights(); stopLights(); spinning = false;
  document.getElementById('resultBanner').classList.remove('show');
  document.getElementById('dealerBar').style.display = 'none';
  document.getElementById('spinBtn').textContent = '🎲 تويليد';
  document.getElementById('spinBtn').disabled = false;
  setArrow(-1);
}

function openTawleed() {
  document.getElementById('tawleedOverlay').classList.add('show');
  syncNames();
}
function closeTawleed() {
  document.getElementById('tawleedOverlay').classList.remove('show');
}

function addQuick(pts, team) {
  if (AC.state==='suspended') AC.resume();
  playAddRound();
  const inp = document.getElementById(team==='us'?'usInp':'themInp');
  inp.value = (parseInt(inp.value)||0) + pts;
}

function addRound() {
  if (AC.state==='suspended') AC.resume();
  playAddRound();
  const us   = parseInt(document.getElementById('usInp').value)   || 0;
  const them = parseInt(document.getElementById('themInp').value) || 0;
  const dealer = (dealerIdx>=0 && players.length) ? players[dealerIdx] : null;
  rounds.push({us, them, dealer});
  document.getElementById('usInp').value = document.getElementById('themInp').value = '';
  if (dealerIdx>=0) {
    dealerIdx = (dealerIdx+1)%4;
    updateDealerBar();
    setArrow(dealerIdx, players[dealerIdx]);
  }
  render();
}

function deleteRound(i) { rounds.splice(i,1); render(); }

function clearAll() {
  if (!rounds.length) return;
  rounds = [];
  dealerIdx = -1;
  players = [];
  arrowDeg = 0;
  setArrow(-1);
  render();
}

let newGameConfirm = false;
let newGameTimer = null;

function newGameToggle() {
  const btn = document.getElementById('newGameBtn');
  if (!newGameConfirm) {
    newGameConfirm = true;
    btn.textContent = '⚠️ متأكد؟ اضغط مرة ثانية';
    btn.classList.add('confirm');
    newGameTimer = setTimeout(() => {
      newGameConfirm = false;
      btn.textContent = '🔄 صكة جديدة';
      btn.classList.remove('confirm');
    }, 3000);
  } else {
    clearTimeout(newGameTimer);
    newGameConfirm = false;
    btn.textContent = '🔄 صكة جديدة';
    btn.classList.remove('confirm');
    // Reset everything
    rounds = [];
    dealerIdx = -1;
    players = [];
    arrowDeg = 0;
    setArrow(-1);
    resetTawleed();
    render();
  }
}

function render() {
  let usT=0, themT=0;
  rounds.forEach(r => { usT+=r.us; themT+=r.them; });
  ['usTotal','themTotal'].forEach((id,i) => {
    const el = document.getElementById(id);
    el.textContent = i===0 ? usT : themT;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  });
  const t = parseInt(document.getElementById('targetScore').value);
  document.getElementById('usProgress').textContent   = t>0 ? usT+' / '+t : '';
  document.getElementById('themProgress').textContent = t>0 ? themT+' / '+t : '';
  const msg = document.getElementById('winnerMsg');
  msg.className = 'winner-msg';
  if (t>0 && rounds.length && (usT>=t || themT>=t)) {
    msg.classList.add('show');
    msg.classList.add(usT>themT?'us':themT>usT?'them':'draw');
    msg.textContent = usT>themT?'🏆 فريق نحن فاز!':themT>usT?'🏆 فريق هم فاز!':'🤝 تعادل!';
    if (AC.state!=='suspended') playWin();
  }
  const list = document.getElementById('histList');
  if (!rounds.length) { list.innerHTML='<div class="empty">لا توجد جولات بعد</div>'; return; }
  list.innerHTML = rounds.map((r,i) => `
    <div class="round-wrap" id="rw${i}">
      <div class="del-bg"><span class="del-bg-icon">✕</span></div>
      <div class="round-row" id="rr${i}"
        ontouchstart="swipeStart(event,${i})"
        ontouchmove="swipeMove(event,${i})"
        ontouchend="swipeEnd(event,${i})">
        <span class="rnd-num">${i+1}</span>
        <span class="rnd-us">${r.us}</span>
        <span class="rnd-sep">–</span>
        <span class="rnd-them">${r.them}</span>
        <span class="rnd-dealer">${r.dealer?'🃏 '+r.dealer:''}</span>
        <button class="del-btn" onclick="deleteRound(${i})">✕</button>
      </div>
    </div>`).join('');
}

let swipeTouchX = 0;
function swipeStart(e,i) { swipeTouchX = e.touches[0].clientX; }
function swipeMove(e,i) {
  const dx = e.touches[0].clientX - swipeTouchX;
  const row = document.getElementById('rr'+i);
  if (!row) return;
  if (dx<0) row.style.transform = 'translateX('+Math.max(dx,-100)+'px)';
}
function swipeEnd(e,i) {
  const dx = e.changedTouches[0].clientX - swipeTouchX;
  const row = document.getElementById('rr'+i);
  if (!row) return;
  if (dx < -60) {
    row.style.transform = 'translateX(-100%)';
    row.style.transition = 'transform 0.25s ease';
    setTimeout(()=>deleteRound(i), 250);
  } else {
    row.style.transform = '';
  }
}
</script>
